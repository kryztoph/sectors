[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sectors"
version = "0.1.0"
description = "Read-only S&P 500 sector rotation monitor."
readme = "README.md"
requires-python = ">=3.11"

[project.optional-dependencies]
live = ["yfinance>=0.2.40"]

[project.scripts]
sectors = "sectors.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["sectors*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
